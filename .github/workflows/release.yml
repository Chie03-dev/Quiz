name: Release (Windows exe)

# Tag a version (v0.1.0) to publish the downloadable Windows builds on the
# Releases page, the same way the Android app publishes an .apk.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build the Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The postinstall step fetches the Electron build of better-sqlite3.
        run: npm ci

      - name: Typecheck, build and package
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}

      - name: SmartScreen reputation check
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            Write-Host "Built: $($_.Name) ($($_.Length) bytes)"
          }
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append release/SHA256SUMS.txt
          }

      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file release/sbom.json

      - name: Upload the exes to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: quiz-instructor-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/sbom.json
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: true
          generate_release_notes: true
          body: |
            Two builds are attached:

            - `QuizInstructor-<version>-setup.exe` - an installer. It puts the
              app in `%LOCALAPPDATA%\Programs\Quiz Instructor`, needs no admin
              rights and gives the app a stable path. **Use this one.**
            - `QuizInstructor-<version>-portable.exe` - the app in a single
              file, unpacked to a temporary folder on every start. Nothing is
              installed, but Windows treats it as a new program each time and
              may ask about the firewall again.

            **Windows may warn you about an unknown publisher.** The build is
            not code-signed, so SmartScreen shows "Windows protected your PC".
            Click **More info** -> **Run anyway**.

            The app runs a quiz server on your LAN (ports 8080-8089) and shows
            a QR code the students scan. When Windows Firewall is blocking that,
            the app asks at startup and offers to open the firewall for you.
