name: Release (Windows exe)

# Tag a version (v0.1.0) to publish the downloadable Windows builds on the
# Releases page, the same way the Android app publishes an .apk.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build the Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The postinstall step fetches the Electron build of better-sqlite3.
        run: npm ci

      - name: Typecheck, build and package
        run: npm run dist
        env:
          # Signing happens only when a certificate is configured; without one
          # the build is produced unsigned, exactly as before.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}

      - name: Verify code signature
        # Meaningful only for a signed build; unsigned builds skip this step.
        if: secrets.CSC_LINK != ''
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem release/*.exe | ForEach-Object {
            $out = & signtool verify /pa $_.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              $failed = 1
              Write-Error "Signature verification failed for $($_.Name): $out"
            } else {
              Write-Host "Signature OK: $($_.Name)"
            }
          }
          if ($failed -ne 0) { exit 1 }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append release/SHA256SUMS.txt
          }

      - name: Generate SBOM
        run: npx --yes @cyclonedx/cdxgen -o release/sbom.json --no-install-deps

      - name: Upload the exes to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: quiz-instructor-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/sbom.json
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/sbom.json
          draft: true
          generate_release_notes: true
          body: |
            Two builds are attached:

            - `QuizInstructor-<version>-setup.exe` - an installer. It puts the
              app in `%LOCALAPPDATA%\Programs\Quiz Instructor`, needs no admin
              rights and gives the app a stable path. **Use this one.**
            - `QuizInstructor-<version>-portable.exe` - the app in a single
              file, unpacked to a temporary folder on every start. Nothing is
              installed, but Windows treats it as a new program each time and
              may ask about the firewall again.

            ## Verifying the download

            `SHA256SUMS.txt` next to the installers lists the SHA-256 of each
            build. Check it before running anything:

            ```powershell
            Get-FileHash .\QuizInstructor-<version>-setup.exe -Algorithm SHA256
            ```

            The hash must match the line for that file in `SHA256SUMS.txt`.
            `sbom.json` is a CycloneDX software bill of materials for the same
            build.

            ## Code signing and SmartScreen

            This build is signed when a certificate is configured. A signed
            build still needs a few installs before Microsoft SmartScreen stops
            warning about the publisher - that reputation is earned over time,
            so an early signed release can still show a warning. An unsigned
            build always shows **Windows protected your PC**; click
            **More info** -> **Run anyway**.

            ## Updating and rolling back

            - **Updating:** run the new installer (or replace the portable exe).
              The app migrates its database on startup; your quiz library, meme
              tray and saved results are kept.
            - **Before a major update:** use the app's **Backup data** button
              (Settings) to copy `quiz-library.db` somewhere safe.
            - **Rolling back:** install the previous version from the Releases
              list. The database is forward-compatible only - after rolling
              back, restore the backup you took before updating, because a
              newer database may contain tables the older app does not know.

            The app runs a quiz server on your LAN (ports 8080-8089) and shows
            a QR code the students scan. When Windows Firewall is blocking that,
            the app asks at startup and offers to open the firewall for you.
